<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">One Stuck event, end to end</title>
  <desc id="d">Sequence diagram with six lifelines: monday.com, n8n, API Gateway, Lambda, CloudWatch Logs and Slack. Every two minutes n8n queries the board for Stuck items, splits the list, drops items already alerted on, builds a JSON body and posts it to API Gateway with the API key. The gateway invokes Lambda, which writes one log line and returns 200 with a request id. n8n then posts the alert to Slack with that request id.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23272e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9098"/></marker>
    <style>
      .bg{fill:#f4f2ee}
      .t{fill:#1f2328;font-size:15px;font-weight:600}
      .s{fill:#5b616b;font-size:12.5px}
      .m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;fill:#5b616b;font-size:11.5px;letter-spacing:.06em}
      .h{fill:#1f2328;font-size:13px;font-weight:600}
      .box{fill:#fff;stroke:#cfc9bf;stroke-width:1.2}
      .node{fill:#fbfaf8;stroke:#23272e;stroke-width:1.6}
      .ext{fill:#fff;stroke:#9aa0a8;stroke-width:1.2;stroke-dasharray:4 3}
      .hot{fill:#fbe9df;stroke:#d9622b;stroke-width:1.4}
      .ln{stroke:#23272e;stroke-width:1.8;fill:none}
      .ov{stroke:#d9622b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
      .gy{stroke:#8b9098;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lab{fill:#d9622b;font-size:12px;font-weight:600}
      .labg{fill:#5b616b;font-size:12px}
    </style>
  </defs>
  <rect class="bg" width="1200" height="900" rx="10"/>

  <text x="40" y="44" class="m">TECHNICAL SUPPORT LAB · AUTOMATION · HAPPY PATH</text>
  <text x="40" y="70" style="fill:#1f2328;font-size:22px;font-weight:700">How one Stuck event moves, from the board to the channel</text>

  <!-- AWS caption -->
  <rect x="420" y="96" width="560" height="690" rx="10" fill="#efece6" stroke="#cfc9bf"/>
  <text x="700" y="114" class="m" text-anchor="middle">AWS · US-EAST-2</text>

  <!-- Lifeline heads -->
  <rect class="ext" x="50" y="126" width="160" height="50" rx="8"/>
  <text x="130" y="147" class="t" text-anchor="middle">monday.com</text>
  <text x="130" y="166" class="s" text-anchor="middle">board, Status column</text>

  <rect class="node" x="240" y="126" width="160" height="50" rx="8"/>
  <text x="320" y="147" class="t" text-anchor="middle">n8n</text>
  <text x="320" y="166" class="s" text-anchor="middle">self-hosted on the LAN</text>

  <rect class="box" x="430" y="126" width="160" height="50" rx="8"/>
  <text x="510" y="147" class="t" text-anchor="middle">API Gateway</text>
  <text x="510" y="166" class="s" text-anchor="middle">REST API, API key</text>

  <rect class="box" x="620" y="126" width="160" height="50" rx="8"/>
  <text x="700" y="147" class="t" text-anchor="middle">Lambda</text>
  <text x="700" y="166" class="s" text-anchor="middle">lab-webhook, Python</text>

  <rect class="box" x="810" y="126" width="160" height="50" rx="8"/>
  <text x="890" y="147" class="t" text-anchor="middle">CloudWatch Logs</text>
  <text x="890" y="166" class="s" text-anchor="middle">one line per request</text>

  <rect class="ext" x="1000" y="126" width="160" height="50" rx="8"/>
  <text x="1080" y="147" class="t" text-anchor="middle">Slack</text>
  <text x="1080" y="166" class="s" text-anchor="middle">channel, chat:write</text>

  <!-- Lifelines -->
  <path class="gy" d="M130,176 L130,770"/>
  <path class="gy" d="M320,176 L320,770"/>
  <path class="gy" d="M510,176 L510,770"/>
  <path class="gy" d="M700,176 L700,770"/>
  <path class="gy" d="M890,176 L890,770"/>
  <path class="gy" d="M1080,176 L1080,770"/>

  <!-- 1: poll -->
  <text x="225" y="208" class="m" text-anchor="middle">01</text>
  <text x="225" y="224" class="s" text-anchor="middle">GraphQL query, every 2 min</text>
  <path class="ln" d="M318,232 L134,232" marker-end="url(#a)"/>
  <text x="225" y="256" class="s" text-anchor="middle">items with Status = Stuck</text>
  <path class="gy" d="M132,264 L316,264" marker-end="url(#ag)"/>

  <!-- 2, 3, 4: inside n8n -->
  <rect class="box" x="190" y="290" width="250" height="40" rx="6"/>
  <text x="202" y="307" class="m">02 · SPLIT OUT</text>
  <text x="202" y="323" class="s">one item per run</text>

  <rect class="box" x="190" y="342" width="250" height="56" rx="6"/>
  <text x="202" y="359" class="m">03 · REMOVE DUPLICATES</text>
  <text x="202" y="375" class="s">memory keyed on item id plus</text>
  <text x="202" y="391" class="s">status change time. Seen? Drop it</text>

  <rect class="box" x="190" y="410" width="250" height="40" rx="6"/>
  <text x="202" y="427" class="m">04 · SET: JSON BODY</text>
  <text x="202" y="443" class="s">source, event, item, owner, due, board</text>

  <!-- 5: POST -->
  <text x="415" y="478" class="m" text-anchor="middle">05</text>
  <text x="415" y="494" class="s" text-anchor="middle">HTTPS POST, x-api-key</text>
  <path class="ln" d="M322,502 L506,502" marker-end="url(#a)"/>
  <text x="605" y="494" class="s" text-anchor="middle">key and plan pass, invoke</text>
  <path class="ln" d="M512,502 L696,502" marker-end="url(#a)"/>

  <!-- 6: validate, log, 200 -->
  <rect class="hot" x="610" y="520" width="180" height="40" rx="6"/>
  <text x="622" y="537" class="m" style="fill:#a2451b">06 · VALIDATE</text>
  <text x="622" y="553" class="s" style="fill:#a2451b">under 64 KB, a JSON object</text>

  <text x="795" y="582" class="s" text-anchor="middle">one JSON log line</text>
  <path class="ln" d="M702,590 L886,590" marker-end="url(#a)"/>

  <text x="605" y="620" class="s" text-anchor="middle">200, request id</text>
  <path class="gy" d="M698,628 L514,628" marker-end="url(#ag)"/>
  <text x="415" y="620" class="s" text-anchor="middle">200, request id</text>
  <path class="gy" d="M508,628 L324,628" marker-end="url(#ag)"/>

  <!-- 7: Slack -->
  <rect x="686" y="656" width="28" height="16" fill="#efece6"/>
  <rect x="530" y="672" width="340" height="16" fill="#efece6"/>
  <rect x="686" y="704" width="28" height="16" fill="#efece6"/>
  <text x="700" y="668" class="m" text-anchor="middle">07</text>
  <text x="700" y="684" class="s" text-anchor="middle">post alert: item, owner, due date, request id</text>
  <path class="ln" d="M322,692 L1076,692" marker-end="url(#a)"/>
  <text x="700" y="716" class="s" text-anchor="middle">ok</text>
  <path class="gy" d="M1078,724 L324,724" marker-end="url(#ag)"/>

  <!-- Why the id travels -->
  <rect x="40" y="800" width="1120" height="36" rx="6" fill="#efece6" stroke="#cfc9bf"/>
  <text x="54" y="823" class="s">The request id rides from Lambda to the Slack message, so any alert in the channel maps to one CloudWatch line in seconds.</text>

  <!-- Legend -->
  <line x1="40" y1="864" x2="80" y2="864" class="ln"/><text x="88" y="868" class="s">Request</text>
  <line x1="160" y1="864" x2="200" y2="864" class="gy"/><text x="208" y="868" class="s">Reply</text>
  <rect class="hot" x="270" y="855" width="24" height="16" rx="3"/><text x="302" y="868" class="s">Guard rail inside the function</text>
  <text x="1160" y="868" class="m" text-anchor="end">HOSTNAMES, KEYS AND IDS OMITTED ON PURPOSE</text>
</svg>
